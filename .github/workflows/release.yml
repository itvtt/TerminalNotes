# Terminal Notes release: a self-hosted Windows runner builds every push to main, picks the next version,
# and publishes a GitHub Release with two assets:
#   TerminalNotes-Setup.exe   users install once with this (per user, no admin rights)
#   TerminalNotes-win-x64.zip the installed app checks the latest release at startup (UPDATE_* in .env)
#                             and updates itself from this zip
#
# The build is build\Publish-Release.ps1: it needs only the .NET 10 SDK on the runner (no NuGet download,
# no extra actions besides checkout) and runs in Windows PowerShell 5.1.
#
# Setup (once, in the repository settings):
#   - Secret TERMINALNOTES_ENV: the full contents of your .env (RELAY_* and UPDATE_* lines).
#     Alternatively keep a .env on the runner machine and set the runner env var TERMINALNOTES_ENV_PATH.
#   - The runner needs the .NET 10 SDK and the labels: self-hosted, windows.
name: Release

on:
  push:
    branches: [main]
    paths-ignore: ['docs/**', '**.md', 'tests/**', 'relay/**']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release, for example 1.2.0 (empty: the next patch)'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: terminalnotes-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: [self-hosted, windows]
    timeout-minutes: 30
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
      DOTNET_SKIP_FIRST_TIME_EXPERIENCE: '1'
    steps:
      - uses: actions/checkout@v4

      - name: Restore .env
        shell: powershell
        env:
          TN_ENV: ${{ secrets.TERMINALNOTES_ENV }}
        run: |
          if ($env:TN_ENV) { [IO.File]::WriteAllText("$PWD\.env", $env:TN_ENV, (New-Object Text.UTF8Encoding($false))) }
          elseif ($env:TERMINALNOTES_ENV_PATH -and (Test-Path $env:TERMINALNOTES_ENV_PATH)) { Copy-Item $env:TERMINALNOTES_ENV_PATH .env -Force }
          else { Write-Host "::warning::.env not provided; no problem reports, default account lists, and updates check this repository without UPDATE_TOKEN." }

      - name: Pick version
        id: version
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_VERSION: ${{ github.event.inputs.version }}
        run: |
          [Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12
          [xml]$project = Get-Content TerminalNotes.csproj -Encoding UTF8
          $base = [version](@($project.Project.PropertyGroup.Version) | Where-Object { $_ } | Select-Object -First 1)
          $latest = $null
          try {
            $release = Invoke-RestMethod -UseBasicParsing -Uri "${{ github.api_url }}/repos/${{ github.repository }}/releases/latest" `
              -Headers @{ Authorization = "Bearer $env:GH_TOKEN"; Accept = 'application/vnd.github+json' }
            $latest = [version]($release.tag_name.TrimStart('v', 'V'))
          } catch { Write-Host "No previous release." }
          # Never go backwards: the csproj version is the floor, otherwise one past the latest release.
          # Every part 0-9: 1.0.9 -> 1.1.0, 1.9.9 -> 2.0.0.
          if ($latest -and $latest -ge $base) { $major = $latest.Major; $minor = $latest.Minor; $patch = $latest.Build + 1; if ($patch -gt 9) { $patch = 0; $minor++ }; if ($minor -gt 9) { $minor = 0; $patch = 0; $major++ }; $next = [version]::new($major, $minor, $patch) } else { $next = [version]::new($base.Major, $base.Minor, [Math]::Max(0, $base.Build)) }
          if ($env:REQUESTED_VERSION -and $env:REQUESTED_VERSION.Trim()) {
            $wanted = $env:REQUESTED_VERSION.Trim().TrimStart('v', 'V')
            if ($wanted -notmatch '^\d+\.\d\.\d$') { throw "Version must look like 1.2.3 (middle and last 0-9): $wanted" }
            if ($latest -and [version]$wanted -le $latest) { throw "Version $wanted must be above the latest release." }
            $next = [version]$wanted
          }
          Write-Host "Version $next"
          Add-Content -Path $env:GITHUB_OUTPUT -Value "version=$next" -Encoding ASCII

      - name: Build
        id: build
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File build\Publish-Release.ps1 -Version ${{ steps.version.outputs.version }}

      # 초안으로 만들어 파일을 모두 올린 뒤 공개 (build\New-GitHubRelease.ps1). 큰 Setup.exe 는 curl 로 올림:
      # Windows PowerShell 의 Invoke-RestMethod 는 github.com 에 수십 MB 를 올리다 연결이 끊김
      - name: Create release
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
          RELEASE_ASSETS: ${{ steps.build.outputs.zip }};${{ steps.build.outputs.setup }}
          RELEASE_TITLE: Terminal Notes
          RELEASE_FOOTER: '처음 설치: TerminalNotes-Setup.exe 를 실행하세요. 설치된 앱은 시작할 때 스스로 업데이트합니다.'
        run: powershell -NoProfile -ExecutionPolicy Bypass -File build\New-GitHubRelease.ps1

      # 빌드가 끝나면 컴파일러 서버(VBCSCompiler · MSBuild 서버)를 끔: 끝난 뒤에도 몇 분씩 수백 MB 를 잡고 있음 (빌드 속도는 그대로).
      # 이 PC 에서 다른 작업이 아직 빌드 중이면(Runner.Worker 가 둘 이상) 그 빌드가 쓰므로 끄지 않음
      - name: Free build memory
        if: always()
        shell: powershell
        run: |
          try { if (@(Get-Process Runner.Worker -ErrorAction SilentlyContinue).Count -le 1) { dotnet build-server shutdown } } catch { Write-Host "build-server shutdown skipped: $_" }
          exit 0
